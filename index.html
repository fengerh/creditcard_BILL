<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信用卡管理 v20260612.1400</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card-bg: #ffffff;
    --primary: #f19603;
    --danger: #e74c3c;
    --warning: #f39c12;
    --info: #2ecc71;
    --text: #2c3e50;
    --border: #e0e6ed;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
  .container { max-width: 1400px; margin:0 auto; overflow-x: hidden;}
  h1 { font-size: 1.8rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .alert-bar { background: #fff3cd; border:1px solid #ffc107; border-radius:8px; padding:10px 15px; margin-bottom:20px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .alert-item { font-size:0.9rem; padding:4px 10px; border-radius:4px; }
  .alert-red { background: #fce4e4; color: #c0392b; }
  .alert-orange { background: #fef3e2; color: #e67e22; }
  .alert-yellow { background: #fff9e6; color: #b8860b; }

  .tabs { display:flex; gap:10px; margin-bottom:20px; }
  .tab-btn { padding:8px 20px; font-size: 1rem;border:1px solid var(--border); background: white; border-radius:6px; cursor:pointer; transition:0.2s; }
  .tab-btn.active { background: var(--primary); color:white; border-color:var(--primary); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap:15px; flex-wrap: wrap; }
  .filters { display: flex; gap:10px; flex-wrap: wrap; align-items: center; }
  .filters select, .filters input, .filters button { padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:0.9rem; background:white; }
  .btn { background: var(--primary); color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:500; }
  .btn-sm { padding:6px 12px; font-size:0.9rem; }
  .btn-outline { background: white; color: var(--primary); border:1px solid var(--primary);}
  .btn-danger { background: var(--danger); }
  table { width:100%; border-collapse: collapse; background: var(--card-bg); border-radius:10px; overflow:hidden; box-shadow: var(--shadow); }
  th { background: #f8fafd; padding:12px 8px; text-align:left; font-weight:600; font-size:0.85rem; border-bottom:1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { background: #eef2f7; }
  td { padding:10px 8px; border-bottom:1px solid var(--border); font-size:0.9rem; white-space: nowrap; }
  tr:hover { background: #f5f9ff; }
  .urgent-red { background: #ffe6e6 !important; }
  .urgent-orange { background: #fff3e0 !important; }
  .urgent-yellow { background: #fffde6 !important; }

  .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-content { background:white; border-radius:12px; padding:24px; width:500px; max-height:80vh; overflow-y:auto; box-shadow:0 8px 30px rgba(0,0,0,0.2); }
  .form-group { margin-bottom:5px; }
  .form-group label { display:block; margin-bottom:0px; font-weight:500; font-size:0.9rem; }
  .form-group input, .form-group select, .form-group textarea { width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; }

  #cardModal .form-group {
    margin-bottom: 10px;
  }
  #cardModal .form-group:last-of-type {
    margin-bottom: 0;
  }

  .detail-item {
      background: #f9f9fb;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
  }
  .detail-item strong {
      display: block;
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 4px;
  }
  .detail-item span {
      font-size: 0.9rem;
      font-weight: 500;
      word-break: break-word;
  }

  .calendar-container { display: flex; flex-direction: column; gap: 20px; }
  .calendar-box { width: 100%; background: white; border-radius: 12px; padding: 15px; box-shadow: var(--shadow); }
  .calendar { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
  .cal-header { font-weight:600; text-align:center; padding:5px; font-size:0.9rem; color:#7f8c8d; }
  .cal-day { min-height:60px; border:1px solid var(--border); border-radius:6px; padding:4px; font-size:0.8rem; position:relative; background:#fcfcfc; transition: background 0.2s; }
  .cal-day .num { font-weight:600; }
  .cal-day .marker { font-size:0.6rem; padding:1px 3px; border-radius:3px; margin-top:2px; display:block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #e0e0e0; }
  .marker-bill { background: #d4e6ff !important; }
  .marker-due { background: #fdebd0 !important; }
  .month-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
  .month-nav span { font-weight: 600; }

  /* 1. 让格子成为“容器查询”的参考，并隐藏溢出 */
  .cal-day {
    position: relative;
    overflow: hidden; 
    container-type: inline-size; /* 关键：让子元素可以获取这个格子的宽度 */
  }

  /* 2. 使用 Flexbox 完美居中，彻底解决上半部分被裁剪的问题 */
  .month-bg-label {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    
    display: flex;
    justify-content: center; /* 水平居中 */
    align-items: center;     /* 垂直居中 */
    
    white-space: nowrap;     /* 绝对不换行 */
    
    /* ⭐ 核心：字体大小根据格子宽度自动计算。
      12cqw 代表字体高度为格子宽度的 12%。
      如果是 12月，你可以改大到 14cqw；如果是 6月，可以改大到 18cqw */
    font-size: 25cqw;        
    
    font-weight: 900;
    color: rgba(0, 0, 0, 0.05); /* 灰色半透明 */

    /* ⭐ 核心修改：横向拉伸，让字变宽变胖！
    1.3 表示拉宽 30%。
    你可以改成 1.5 (更宽) 或 1.2 (稍微宽一点) */
    transform: scaleX(1.3); 
    
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  /* 3. 确保日期数字和事件标签在最上层 */
  .cal-day .num, 
  .cal-day .marker {
    position: relative;
    z-index: 1;
  }
  

  .cal-filter-bar { margin-bottom: 15px; display: flex; gap: 10px; }
  .cal-filter-btn { padding:4px 12px; font-size:0.8rem; border:1px solid var(--border); background: white; border-radius:4px; cursor:pointer; }
  .cal-filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .badge { font-size:0.7rem; padding:2px 6px; border-radius:4px; background:#eee; margin-right:4px; }
  .hide { display:none !important; }
  .color-picker { width: 32px; height: 24px; padding:0; border:none; cursor: pointer; vertical-align: middle; }
  .inline-check { display: flex; align-items: center; gap: 8px; margin-top: 5px; }

  /* 操作文字链接 */
  .action-links { display: flex; gap: 8px; }
  .action-link { color: var(--primary); text-decoration: none; cursor: pointer; font-size:0.85rem; }
  .action-link:hover { text-decoration: underline; }
  .action-link.danger { color: var(--danger); }

  /* 手机端简单适配 */
  @media (max-width: 768px) {
    body { padding: 12px; }
    h1 { font-size: 1.4rem; flex-wrap: wrap; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar > div:last-child { justify-content: flex-end; }
    .filters { width: 100%; overflow-x: auto; }
    .filters select, .filters input { flex-shrink: 0; }
    table { min-width: 850px; }
    th, td { padding: 8px 4px; font-size: 0.8rem; }
    .modal-content { width: 95vw; max-height: 90vh; padding: 16px; }
    .calendar-box { padding: 10px; }
    .cal-day { min-height: 45px; font-size: 0.7rem; }
    .cal-day .marker { font-size: 0.55rem; }
    .detail-item strong { width: 70px; }
  }


  /* 表格内容居中 */
  #cardTable th,
  #cardTable td {
      text-align: center;
      vertical-align: middle;
  }

  .action-links {
      display: flex;
      
      justify-content: center;  /* 让内部链接居中 */
  }

  html {
      overflow-y: scroll;
  }

  /* 银行及额度管理表格全部居中 */
  #bankModal table th,
  #bankModal table td {
      text-align: center;
      vertical-align: middle;
  }

  /* 推算日期一体式组合框 */
  .date-picker-group {
      display: inline-flex;
      align-items: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
  }

  .date-picker-group .date-label {
      padding: 6px 10px;
      background: #f8fafd;
      border-right: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text);
  }

  .date-picker-group .date-input {
      border: none;
      padding: 6px 8px;
      font-size: 0.9rem;
      outline: none;
      min-width: 80px;
  }

  .date-picker-group .date-input:focus {
      background: #fffef7;
  }

  /* 账单日范围筛选一体式组合框 */
  .billday-group {
      display: inline-flex;
      align-items: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #fff;
  }

  .billday-group .billday-label {
      padding: 6px 10px;
      background: #f8fafd;
      border-right: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text);
  }

  .billday-group .billday-input {
      border: none;
      padding: 6px 8px;
      font-size: 0.9rem;
      outline: none;
      width: 52px;
      text-align: center;
  }

  .billday-group .billday-input:focus {
      background: #fffef7;
  }

  .billday-group .billday-sep {
      padding: 0 4px;
      color: #aaa;
      font-weight: 500;
      user-select: none;
  }

  .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 20px;
  }

  /* 银行行：标签、下拉框、按钮排成一行 */
  .form-group-bank {
      display: flex;
      flex-direction: column;
      gap: 0px;
  }
  .form-group-bank label {
      margin-bottom: 0;
      font-weight: 500;
  }

  .form-group-bank .bank-row {
      display: flex;
      align-items: center;
      gap: 10px;
  }
  .form-group-bank select {
      flex: 1;
  }
  .form-group-bank button {
      white-space: nowrap;
  }

  /* 禁用按钮的灰色样式 */
  .btn:disabled,
  .btn[disabled] {
      background: #cccccc !important;
      color: #666666 !important;
      cursor: not-allowed !important;
      opacity: 0.6;
  }

  /* 如果是 btn-outline 类型的禁用样式（可选） */
  .btn-outline:disabled,
  .btn-outline[disabled] {
      background: #f5f5f5 !important;
      color: #999999 !important;
      border-color: #cccccc !important;
      cursor: not-allowed !important;
  }

  #orgCheckboxes {
      display: flex;
      
      gap: 12px 20px;            /* 行间距12px，列间距20px */
      min-height: 10px;
  }
  #orgCheckboxes label {
      display: inline-flex;      /* 或 flex，但 inline-flex 更紧凑 */
      align-items: center;       /* 垂直居中 */
      gap: 4px;                  /* 复选框与文字间距 */
      white-space: nowrap;       /* 文字不换行 */
      cursor: pointer;
      margin-bottom: 6px;                 
      margin-top: 6px;                 /* 每个标签上下间距8px */
    }
  
  

</style>
</head>
<body>
<div class="container">
  <h1>💳 信用卡管理
    <span style="margin-left:auto; display:flex; gap:10px;">
      <button class="btn btn-sm btn-outline" id="manageBankBtn">🏦 银行及额度管理</button>
      <button class="btn btn-sm btn-outline" id="exportBtn">📥 导出备份</button>
      <button class="btn btn-sm btn-outline" id="importBtn">📤 导入恢复</button>
    </span>
  </h1>

  <div class="alert-bar" id="alertBar">
    <span>⏰ 还款提醒：</span>
    <span id="alertToday" class="alert-item alert-red">今日到期 0</span>
    <span id="alert3day" class="alert-item alert-orange">3天内 0</span>
    <span id="alert7day" class="alert-item alert-yellow">7天内 0</span>
    <span style="margin-left:auto; font-size:0.8rem;">基于推算日刷新</span>
  </div>

  <div class="toolbar">
    <div style="display:flex; gap:10px;">
      <button class="tab-btn active" id="tabList">📋 卡片列表</button>
      <button class="tab-btn" id="tabCalendar">📅 日历视图</button>
      <!-- 添加卡片按钮，初始显示（因为默认列表视图） -->
        <button class="cal-filter-btn active" id="addCardBtn" style="margin-left: 10px;">＋添加卡片</button>
        <!-- 三个筛选按钮，初始隐藏（因为默认显示列表视图） -->
        <div id="calendarFilterBtns" style="display: none; margin-left: 15px; gap: 8px;">
            <button class="cal-filter-btn active" data-filter="all">账单及还款日</button>
            <button class="cal-filter-btn" data-filter="bill">仅账单日</button>
            <button class="cal-filter-btn" data-filter="due">仅还款日</button>
        </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn btn-sm  btn-outline" id="prevDay">前一天</button>
        <button class="btn btn-sm  btn-outline" id="nextDay">后一天</button>
        <div class="date-picker-group">

          <span class="date-label">推算日</span>
          <input type="date" id="simulateDate" class="date-input">
        </div>

        <button class="btn btn-sm  btn-outline" id="resetDate">转到今天</button>
    </div>
      
    </div>
  

  <div class="toolbar" id="filterBar">
    <div class="filters" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <select id="filterBank" multiple size="1" style="width:160px;" title="银行（可多选）">
        <option value="">选择银行（共<span id="totalCardCount">0</span>张）</option>
      </select>
      <!-- 新增等级筛选 -->
      <select id="filterLevel" multiple size="1" style="width:100px;" title="等级（可多选）">
        <option value="" selected>选择等级</option>
      </select>
      <div style="display:flex; gap:10px;" id="orgFilters"></div>
      <div style="flex:1;"></div> 
      <div style="margin-left: auto; display: flex; gap: 10px; align-items:center; font-size:0.9rem;">
        <div class="billday-group">
            <span class="billday-label">账单日</span>
            <input type="number" id="billDayFrom" class="billday-input" placeholder="从" min="1" max="31">
            <span class="billday-sep">—</span>
            <input type="number" id="billDayTo" class="billday-input" placeholder="到" min="1" max="31">
        </div>
        <button class="btn btn-sm btn-outline" style="font-size: 0.9rem;" id="clearFilters">清除筛选</button>
    </div>
  </div>
    
  </div>

  <div id="listView">
    <table id="cardTable">
      <thead>
        <tr>
          <th data-sort="bank">银行</th>
          <th data-sort="org">卡组织</th>
          <th data-sort="level">等级</th>
          <th data-sort="lastFour">尾号</th>
          <th data-sort="nickname">昵称</th>
          <th data-sort="billDay">账单日</th>
          <th data-sort="repayment">还款日</th>
          <th data-sort="cardLimit">额度</th>
          <th data-sort="nextBill">下个账单日</th>
          <th data-sort="nextDue">下个还款日</th>
          <th>卡片管家</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="calendarView" class="hide">
    
    <div class="month-nav">
      <button id="prevMonth" class="btn btn-sm btn-outline">◀ 上月</button>
      <span id="calMonthLabel"></span>
      <button id="nextMonth" class="btn btn-sm btn-outline">下月 ▶</button>
    </div>
    <div class="calendar-container">
      <div class="calendar-box">
        <div class="calendar" id="calendarGrid1"></div>
      </div>
      <div class="calendar-box">
        <div class="calendar" id="calendarGrid2"></div>
      </div>
    </div>
    <div style="margin-top:10px; font-size:0.8rem;">
      <span>💡 标签底色：账单日浅蓝，还款日浅橙；文字颜色为银行指定色。高亮日期：推算日（金色渐变）。</span>
    </div>
  </div>
</div>

<div id="bankModal" class="modal hide">
  <div class="modal-content">
    <h3 style="display: flex; justify-content: space-between; align-items: center;">🏦 银行及额度管理 <span id="totalBankLimit" style="font-size:0.9rem; font-weight:normal; color:#555;"></span>
    <button class="btn btn-sm" id="addBankBtn" >添加银行</button>
    </h3>
    <div class="table-wrap" style="margin:15px 0;">
      <table style="width:100%;">
        <thead><tr><th>银行列表</th><th>总额度</th><th>颜色</th><th>操作</th></tr></thead>
        <tbody id="bankListBody"></tbody>
      </table>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      
      <button class="btn btn-sm btn-outline" id="closeBankModal" style="margin-left: auto;">关闭</button>
    </div>
  </div>
</div>

  <div id="cardModal" class="modal hide">
    <div class="modal-content" style="width: 660px; max-width: 80vw;height: 480px; max-height: 70vh; overflow-y: auto; box-shadow:0 8px 30px rgba(0,0,0,0.2);">
      <h3 id="cardModalTitle">添加信用卡</h3>
      <div style="display: grid; grid-template-columns: repeat(3, auto); gap: 16px 20px;"><div style="display: grid; grid-template-columns: 320px 120px 120px; gap: 10px 15px; align-items: center;margin: 0 auto; width: fit-content;">
      <!-- 第1列 -->
      <div>
        <div class="form-group form-group-bank">
          <label>银行</label>
          <div class="bank-row">
            <select id="cardBank"><option value="">选择银行</option></select>
            <button class="btn btn-sm" id="newBankInCard">＋ 新建银行</button>
          </div>
        </div>
        <div class="form-group">
          <label>卡组织（可多选）</label>
          <div id="orgCheckboxes" style="display:flex; gap:10px; flex-wrap:wrap; align-items: left;"></div>
        </div>
        <div class="form-group"><label>联名会员</label><input id="cardRepaymentDesc" placeholder="如国航会员"></div>
        <div class="form-group"><label>卡片额度</label><input type="number" id="cardLimit" placeholder="50000"></div>
      </div>

      <!-- 第2列 -->
      <div>
        <div class="form-group"><label>卡片等级</label><input id="cardLevel" placeholder="如金卡、白金卡"></div>
        <div class="form-group"><label>卡号后4位</label><input id="cardLastFour" maxlength="4" placeholder="1234"></div>
        <div class="form-group"><label>有效期 (MM/YY)</label><input id="cardExpiry" placeholder="12/28" maxlength="5"></div>
        <div class="form-group"><label>VCC / CVV</label><input id="cardVcc" placeholder="123" maxlength="4"></div>
      </div>

      <!-- 第3列 -->
      <div>
        <div class="form-group">
          <div class="form-group"><label>昵称</label><input id="cardNickname" placeholder="我的卡"></div>
          <label>账单日</label>
          <div style="display:flex; gap:0; align-items:center;white-space: nowrap">
            <input type="number" id="billDay" min="1" max="31" placeholder="10" style="flex:1; margin-right: 5px;">
            <label class="inline-check" style="display: flex; align-items: center; gap: 5px; margin-left: 0;"><input type="checkbox"  id="billDayEndOfMonth">月底</label>
          </div>
        </div>
        <div class="form-group">
          <label>还款日</label>
          <select id="repaymentType" style="width:100%;">
            <option value="fixed">固定还款日</option>
            <option value="afterBill">账单日后N天</option>
          </select>
        </div>
        <div class="form-group"><label id="repaymentLabel">固定还款日</label><input type="number" id="repaymentValue" min="1" max="31" placeholder="25"></div>
        </div>
    </div>

    <!-- 备注单独占一行，跨三列 -->
    <div class="form-group" style="grid-column: 1 / -1; margin-top: 0; margin-bottom: 0px;">
      <label>备注（还款方式等）</label><textarea id="cardNote" rows="3" style="width:590px; max-width: auto;"></textarea>
    </div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top: 0px;">
          <button class="btn btn-outline" id="cancelCardBtn">取消</button>
          <button class="btn btn-outline" id="editCardBtn" style="display:none;">编辑</button>
          <button class="btn" id="saveCardBtn">保存</button>
          <button class="btn btn-outline" id="detailCloseBtn" style="display:none;">关闭</button>
      </div>
      <input type="hidden" id="editCardId">
    </div>
  </div>

<div id="detailModal" class="modal hide">
  <div class="modal-content" style="width: 800px; max-width: 90vw;">
    <h3>📋 卡片详情</h3>
    <div id="detailContent" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px;"></div>
    <button class="btn btn-outline" style="margin-top:20px;" id="closeDetailBtn">关闭</button>
  </div>
</div>

<input type="file" id="importFileInput" accept=".json" style="display:none;">

<script>
  const STORAGE_KEY = 'credit_card_app';
  let banks = [];
  let cards = [];
  let editingCardId = null;

  const defaultColors = ['#2b6ef0', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#3498db'];

  function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify({ banks, cards })); }
  function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      banks = data.banks || [];
      cards = data.cards || [];
      banks.forEach((b, i) => { if (!b.color) b.color = defaultColors[i % defaultColors.length]; });
    } else {
      banks = [
        { id: 'b1', name: '招商银行', totalLimit: 100000, color: '#2b6ef0' },
        { id: 'b2', name: '浦发银行', totalLimit: 80000, color: '#e74c3c' }
      ];
      cards = [
        { id: 'c1', bankId: 'b1', organizations: ['银联','Visa'], level: '白金卡', lastFour: '1234', nickname: '经典白', note: '国航会员CA123', cardLimit: 100000, billDay: 10, repaymentType: 'fixed', repaymentValue: 25 },
        { id: 'c2', bankId: 'b1', organizations: ['Mastercard'], level: '金卡', lastFour: '5678', nickname: '万事达', note: '', cardLimit: 50000, billDay: 5, repaymentType: 'afterBill', repaymentValue: 20 }
      ];
      saveData();
    }
  }

  function getActualBillDay(card, year, monthIndex) {
      // monthIndex: 0-11
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      if (card.billDay === 0) return daysInMonth;
      return Math.min(card.billDay, daysInMonth);
}

  function safeDate(year, monthIndex, day) {
      if (day === 0) return new Date(year, monthIndex + 1, 0).getDate();
      const max = new Date(year, monthIndex + 1, 0).getDate();
      return Math.min(day, max);
  }

  // 计算下一个账单日 (>= fromDate)
  function getNextBillDate(card, fromDate) {
    const ref = new Date(fromDate); ref.setHours(0,0,0,0);
    const y = ref.getFullYear();
    const m = ref.getMonth();
    const d = ref.getDate();
    const thisMonthBillDay = getActualBillDay(card, y, m);
    if (d <= thisMonthBillDay) {
      return new Date(y, m, thisMonthBillDay);
    }
    const nextMonth = m + 1;
    const nextYear = nextMonth === 12 ? y + 1 : y;
    const nextBillDay = getActualBillDay(card, nextYear, (nextMonth % 12));
    return new Date(nextYear, nextMonth % 12, nextBillDay);
  }

  // 计算下一个还款日 (>= fromDate)，今天或未来最近的一天
  function getNextDueDate(card, fromDate) {
    const ref = new Date(fromDate);
    ref.setHours(0, 0, 0, 0);
    const y = ref.getFullYear();
    const m = ref.getMonth(); // 0-11
    const d = ref.getDate();

    if (card.repaymentType === 'fixed') {
        // 固定还款日
        const dueDay = card.repaymentValue;
        // 当月可能的还款日
        const thisMonthDue = new Date(y, m, safeDate(y, m, dueDay));
        thisMonthDue.setHours(0, 0, 0, 0);
        if (thisMonthDue >= ref) return thisMonthDue;
        // 下个月
        let nextMonth = m + 1;
        let nextYear = y;
        if (nextMonth > 11) {
            nextMonth = 0;
            nextYear++;
        }
        const nextDue = new Date(nextYear, nextMonth, safeDate(nextYear, nextMonth, dueDay));
        nextDue.setHours(0, 0, 0, 0);
        return nextDue;
    } 
    else {
        // 账单日后 N 天 —— 稳健算法：取上一个和下一个账单日对应的还款日，选最近的一个
        const afterDays = card.repaymentValue;
        const ref = new Date(fromDate);
        ref.setHours(0, 0, 0, 0);

        // 辅助：获取某年某月的账单日（返回 Date 对象）
        function getBillDate(year, monthIndex) {
            if (card.billDay === 0) {
                // 月底
                const lastDay = new Date(year, monthIndex + 1, 0).getDate();
                return new Date(year, monthIndex, lastDay);
            } else {
                const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
                const actualDay = Math.min(card.billDay, daysInMonth);
                return new Date(year, monthIndex, actualDay);
            }
        }

        // 1. 找上一个账单日（小于等于 ref 且最近）
        let prevBillDate = null;
        let y = ref.getFullYear();
        let m = ref.getMonth();
        for (let i = 0; i < 12; i++) {
            const candidate = getBillDate(y, m);
            if (candidate <= ref) {
                prevBillDate = candidate;
                break;
            }
            m--;
            if (m < 0) {
                m = 11;
                y--;
            }
        }
        if (!prevBillDate) prevBillDate = getBillDate(ref.getFullYear(), ref.getMonth());

        // 2. 找下一个账单日（大于 ref 且最近）
        let nextBillDate = null;
        y = ref.getFullYear();
        m = ref.getMonth();
        for (let i = 0; i < 12; i++) {
            const candidate = getBillDate(y, m);
            if (candidate > ref) {
                nextBillDate = candidate;
                break;
            }
            m++;
            if (m > 11) {
                m = 0;
                y++;
            }
        }
        if (!nextBillDate) nextBillDate = getBillDate(ref.getFullYear() + 1, 0);

        // 3. 计算两个还款日
        const due1 = new Date(prevBillDate);
        due1.setDate(due1.getDate() + afterDays);
        const due2 = new Date(nextBillDate);
        due2.setDate(due2.getDate() + afterDays);

        // 4. 筛选大于等于 ref 且最近的那个
        const candidates = [due1, due2].filter(d => d >= ref);
        candidates.sort((a, b) => a - b);
        return candidates[0];
    }
  }

  // 获取最近未过期的还款日，使用推算日期（用于提醒高亮）
  function getUpcomingDueDate(card) {
      const refDate = document.getElementById('simulateDate').valueAsDate || new Date();
      return getNextDueDate(card, refDate);
  }

  function getUrgencyClass(dueDate) {
      const refDate = document.getElementById('simulateDate').valueAsDate || new Date();
      const now = new Date(refDate); now.setHours(0,0,0,0);
      const due = new Date(dueDate); due.setHours(0,0,0,0);
      const diffDays = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return 'urgent-red';
      if (diffDays <= 3) return 'urgent-orange';
      if (diffDays <= 7) return 'urgent-yellow';
      return '';
}

  function getEventsForMonth(card, year, month) {
    const events = [];
    const bank = banks.find(b => b.id === card.bankId);
    const color = bank?.color || '#666';
    const label = `${bank?.name || '未知'}${card.lastFour}${card.nickname ? ' '+card.nickname : ''}`;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const actualBillDay = getActualBillDay(card, year, month);
    if (actualBillDay >= 1 && actualBillDay <= daysInMonth) {
      events.push({ day: actualBillDay, type: 'bill', label, color });
    }
    if (card.repaymentType === 'fixed') {
      const dueDay = card.repaymentValue;
      const actualDueDay = safeDate(year, month+1, dueDay);
      if (actualDueDay >= 1 && actualDueDay <= daysInMonth) {
        events.push({ day: actualDueDay, type: 'due', label, color });
      }
    } else {
      if (actualBillDay >= 1 && actualBillDay <= daysInMonth) {
        const billDate = new Date(year, month, actualBillDay);
        const dueDate = new Date(billDate);
        dueDate.setDate(dueDate.getDate() + card.repaymentValue);
        if (dueDate.getMonth() === month && dueDate.getFullYear() === year) {
          events.push({ day: dueDate.getDate(), type: 'due', label, color });
        }
      }
      const prevMonth = month - 1 < 0 ? 11 : month - 1;
      const prevYear = month === 0 ? year - 1 : year;
      const prevBillDay = getActualBillDay(card, prevYear, prevMonth+1);
      const prevBillDate = new Date(prevYear, prevMonth, prevBillDay);
      const prevDueDate = new Date(prevBillDate);
      prevDueDate.setDate(prevDueDate.getDate() + card.repaymentValue);
      if (prevDueDate.getMonth() === month && prevDueDate.getFullYear() === year) {
        const day = prevDueDate.getDate();
        if (!events.some(e => e.day === day && e.type === 'due')) {
          events.push({ day, type: 'due', label, color });
        }
      }
    }
    return events;
  }

  // ---------- 渲染 ----------
  const cardTableBody = document.querySelector('#cardTable tbody');
  const simulateDateInput = document.getElementById('simulateDate');

  function renderAll() {
    renderBankSelects();
     renderLevelFilter();   // 新增
    renderOrgFilters();
    renderCardTable();
    renderCalendar();
    updateAlerts();
  }

  function renderBankSelects() {
    const filterBank = document.getElementById('filterBank');
    // 记住当前已选中的银行 ID（排除空值）
    const selectedBankIds = Array.from(filterBank.selectedOptions)
      .map(o => o.value)
      .filter(v => v && v !== '');
    
    // 重新构建下拉框
    const totalCards = cards.length;
    filterBank.innerHTML = `<option value="" id="bankPlaceholderOption">选择银行（共${totalCards}张）</option>`;
    
    banks.forEach(b => {
      const count = cards.filter(c => c.bankId === b.id).length;
      const option = document.createElement('option');
      option.value = b.id;
      option.text = `${b.name} (${count}张)`;
      if (selectedBankIds.includes(b.id)) option.selected = true;
      filterBank.appendChild(option);
    });

    // 更新卡片表单中的银行下拉框
    const cardBank = document.getElementById('cardBank');
    if (cardBank) {
      cardBank.innerHTML = '<option value="">选择银行</option>';
      banks.forEach(b => cardBank.innerHTML += `<option value="${b.id}">${b.name}</option>`);
    }
    renderBankModal();
  }

  function renderLevelFilter() {
    const levelSelect = document.getElementById('filterLevel');
    if (!levelSelect) return;
    const currentLevel = levelSelect.value;
    // 收集所有等级
    const levelSet = new Set();
    cards.forEach(c => {
      if (c.level && c.level.trim() !== '') levelSet.add(c.level);
    });
    const levels = [...levelSet].sort();
    levelSelect.innerHTML = '<option value="">选择等级</option>';
    levels.forEach(level => {
      const selectedAttr = currentLevel === level ? 'selected' : '';
      levelSelect.innerHTML += `<option value="${level}" ${selectedAttr}>${level}</option>`;
    });
  }

  function renderOrgFilters() {
    const orgSet = new Set(cards.flatMap(c => c.organizations));
    const container = document.getElementById('orgFilters');
    container.innerHTML = '';
    orgSet.forEach(org => {
      const label = document.createElement('label');
      label.style.display = 'flex'; label.style.alignItems = 'center'; label.style.gap = '4px';
      label.innerHTML = `<input type="checkbox" class="orgFilterCheck" value="${org}"> ${org}`;
      container.appendChild(label);
    });
  }

  function getFilteredCards() {
    // 银行筛选：排除空值
    const bankVal = Array.from(document.getElementById('filterBank').selectedOptions)
      .map(o => o.value)
      .filter(v => v && v !== '');
    // 等级筛选：排除空值和占位符
    const levelVal = Array.from(document.getElementById('filterLevel').selectedOptions)
      .map(o => o.value)
      .filter(v => v && v !== '' && v !== '等级');
    
    const orgChecks = Array.from(document.querySelectorAll('.orgFilterCheck:checked')).map(cb => cb.value);
    const billFrom = parseInt(document.getElementById('billDayFrom').value) || 1;
    const billTo = parseInt(document.getElementById('billDayTo').value) || 31;
    
    return cards.filter(c => {
      if (bankVal.length && !bankVal.includes(c.bankId)) return false;
      if (levelVal.length && (!c.level || !levelVal.includes(c.level))) return false;
      if (orgChecks.length && !orgChecks.some(org => c.organizations.includes(org))) return false;
      const billDay = c.billDay === 0 ? 31 : c.billDay;
      if (billDay < billFrom || billDay > billTo) return false;
      return true;
    });
  }

  function renderCardTable() {
    const referenceDate = simulateDateInput.valueAsDate || new Date();
    const filtered = getFilteredCards();
    const sortKey = cardTableBody.dataset.sortKey || 'billDay';
    const sortDir = cardTableBody.dataset.sortDir || 'asc';

    filtered.sort((a, b) => {
      let valA, valB;
      if (sortKey === 'bank') { valA = banks.find(ba => ba.id === a.bankId)?.name || ''; valB = banks.find(ba => ba.id === b.bankId)?.name || ''; }
      else if (sortKey === 'org') { valA = a.organizations.join(','); valB = b.organizations.join(','); }
      else if (sortKey === 'level') { valA = a.level; valB = b.level; }
      else if (sortKey === 'lastFour') { valA = a.lastFour; valB = b.lastFour; }
      else if (sortKey === 'nickname') { valA = a.nickname; valB = b.nickname; }
      else if (sortKey === 'billDay') {
        valA = a.billDay === 0 ? 32 : a.billDay;
        valB = b.billDay === 0 ? 32 : b.billDay;
      }
      else if (sortKey === 'repayment') {
        valA = a.repaymentType === 'fixed' ? a.repaymentValue : a.repaymentValue;
        valB = b.repaymentType === 'fixed' ? b.repaymentValue : b.repaymentValue;
      }
      else if (sortKey === 'cardLimit') { valA = a.cardLimit; valB = b.cardLimit; }
      else if (sortKey === 'nextBill') {
        valA = getNextBillDate(a, referenceDate).getTime();
        valB = getNextBillDate(b, referenceDate).getTime();
      }
      else if (sortKey === 'nextDue') {
        valA = getNextDueDate(a, referenceDate).getTime();
        valB = getNextDueDate(b, referenceDate).getTime();
      }
      if (typeof valA === 'string') return sortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
      return sortDir === 'asc' ? valA - valB : valB - valA;
    });

    cardTableBody.innerHTML = '';
    filtered.forEach(card => {
      const bank = banks.find(b => b.id === card.bankId);
      const nextBill = getNextBillDate(card, referenceDate);
      const nextDue = getNextDueDate(card, referenceDate);
      const upcomingDue = getUpcomingDueDate(card);
      const urgencyClass = getUrgencyClass(upcomingDue);
      const row = document.createElement('tr');
      row.className = urgencyClass;

      // 根据 urgencyClass 确定还款日文字颜色
      let dueColorStyle = '';
      if (urgencyClass === 'urgent-red') dueColorStyle = 'style="color: #c0392b; font-weight: 500;"';
      else if (urgencyClass === 'urgent-orange') dueColorStyle = 'style="color: #e67e22; font-weight: 500;"';
      else if (urgencyClass === 'urgent-yellow') dueColorStyle = 'style="color: #b8860b; font-weight: 500;"';

      row.innerHTML = `
        <td><span style="color: ${bank?.color || '#000'}; font-weight: 500;">${bank?.name || '未知'}</span></td>
        <td>${card.organizations.map(o => `<span class="badge">${o}</span>`).join('')}</td>
        <td>${card.level || '-'}</td>
        <td>${card.lastFour}</td>
        <td>${card.nickname || '-'}</td>
        <td>${card.billDay === 0 ? '月底' : card.billDay+'日'}</td>
        <td>${card.repaymentType === 'fixed' ? `固定${card.repaymentValue}日` : `账单后${card.repaymentValue}天`}</td>
        <td>¥${card.cardLimit.toLocaleString()}</td>
        <td>${nextBill.getMonth()+1}/${nextBill.getDate()}</td>
        <td ${dueColorStyle}>${nextDue.getMonth()+1}/${nextDue.getDate()}</td>
        <td class="action-links">
          <span class="action-link viewDetailBtn" data-id="${card.id}">详情</span>
          <span class="action-link danger delCardBtn" data-id="${card.id}">删除</span>
        </td>
      `;
      cardTableBody.appendChild(row);
    });

    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.onclick = () => {
        const key = th.dataset.sort;
        if (cardTableBody.dataset.sortKey === key) {
          cardTableBody.dataset.sortDir = cardTableBody.dataset.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          cardTableBody.dataset.sortKey = key;
          cardTableBody.dataset.sortDir = 'asc';
        }
        renderCardTable();
      };
    });
  }

  function updateAlerts() {
      const refDate = document.getElementById('simulateDate').valueAsDate || new Date();
      const ref = new Date(refDate);
      ref.setHours(0, 0, 0, 0);
      let today = 0;
      let threeDay = 0;   // 1-3天
      let sevenDay = 0;   // 4-7天
      cards.forEach(c => {
          const dueDate = getNextDueDate(c, ref);
          const diff = Math.ceil((dueDate - ref) / (1000 * 60 * 60 * 24));
          if (diff === 0) {
              today++;
          } else if (diff <= 3) {
              threeDay++;
          } else if (diff <= 7) {
              sevenDay++;
          }
      });
      document.getElementById('alertToday').innerText = `今天到期 ${today}`;
      document.getElementById('alert3day').innerText = `3天内 ${threeDay}`;
      document.getElementById('alert7day').innerText = `7天内 ${sevenDay}`;
}

  // 日历渲染（保持不变）
  let calYear, calMonth;
  let calFilterMode = 'all';

  function renderCalendar() {
    if (!calYear) {
      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();
    }
    const simulateDate = simulateDateInput.valueAsDate || new Date();
    document.getElementById('calMonthLabel').innerText =
      `${calYear}年${calMonth+1}月  ——  ${(new Date(calYear, calMonth+1)).getFullYear()}年${(new Date(calYear, calMonth+1)).getMonth()+1}月`;

    const grid1 = document.getElementById('calendarGrid1');
    const grid2 = document.getElementById('calendarGrid2');
    renderMonthGrid(grid1, calYear, calMonth, simulateDate);
    const nextDate = new Date(calYear, calMonth + 1, 1);
    renderMonthGrid(grid2, nextDate.getFullYear(), nextDate.getMonth(), simulateDate);
  }

  function renderMonthGrid(grid, year, month, highlightDate) {
    grid.innerHTML = '';
    const daysOfWeek = ['日','一','二','三','四','五','六'];
    daysOfWeek.forEach(d => grid.innerHTML += `<div class="cal-header">${d}</div>`);
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const highlightTime = highlightDate ? new Date(highlightDate.getFullYear(), highlightDate.getMonth(), highlightDate.getDate()).getTime() : null;

    for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div')).className = 'cal-day';

    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'cal-day';
      
    if (d === 1) {
        // 月份显示为两位数字（01, 02, ..., 12）
        const formattedMonth = String(month + 1).padStart(2, '0');
        cell.innerHTML = `<span class="month-bg-label">${formattedMonth}</span><span class="num">${d}</span>`;
    } else {
        cell.innerHTML = `<span class="num">${d}</span>`;
    }

      if (highlightTime) {
        const currentTime = new Date(year, month, d).getTime();
        const diffDays = Math.abs((currentTime - highlightTime) / (1000 * 60 * 60 * 24));
        const maxHighlightRange = 3;
        if (diffDays <= maxHighlightRange) {
          const alpha = 0.3 - (diffDays / maxHighlightRange) * 0.25;
          cell.style.background = `rgba(255, 215, 0, ${Math.max(0, alpha)})`;
        }
        if (diffDays === 0) {
          cell.style.background = 'rgba(255, 215, 0, 0.35)';
          cell.style.fontWeight = 'bold';
          cell.style.border = '2px solid #f39c12';
        }
      }

      const filteredCards = getFilteredCards();  // 复用列表视图的筛选函数
      filteredCards.forEach(card => {
        let events = getEventsForMonth(card, year, month);
        if (calFilterMode === 'bill') events = events.filter(e => e.type === 'bill');
        else if (calFilterMode === 'due') events = events.filter(e => e.type === 'due');
        events.forEach(ev => {
          if (ev.day === d) {
            const marker = document.createElement('span');
            marker.className = `marker ${ev.type === 'bill' ? 'marker-bill' : 'marker-due'}`;
            marker.style.color = ev.color;
            marker.style.fontWeight = 'bold';
            marker.innerText = `${ev.type === 'bill' ? '📄' : '⏳'} ${ev.label}`;
            cell.appendChild(marker);
          }
        });
      });

      grid.appendChild(cell);
    }
  }

  function renderBankModal() {
    const tbody = document.getElementById('bankListBody');
    tbody.innerHTML = '';
    let totalAllBanks = 0;
    banks.forEach(bank => {
      totalAllBanks += bank.totalLimit || 0;
      tbody.innerHTML += `<tr>
        <td>${bank.name}</td>
        <td>¥${bank.totalLimit.toLocaleString()}</td>
        <td><input type="color" class="bankColorPicker" data-id="${bank.id}" value="${bank.color}" style="width:32px; height:24px;"></td>
        <td class="action-links">
          <span class="action-link editBankBtn" data-id="${bank.id}">编辑</span>
          <span class="action-link danger delBankBtn" data-id="${bank.id}">删除</span>
        </td>
      </tr>`;
    });
    document.getElementById('totalBankLimit').innerText = `总授信额度：¥${totalAllBanks.toLocaleString()}`;
    document.querySelectorAll('.bankColorPicker').forEach(input => {
      input.onchange = (e) => {
        const id = e.target.dataset.id;
        const bank = banks.find(b => b.id === id);
        if (bank) { bank.color = e.target.value; saveData(); renderCalendar(); }
      };
    });
  }

    function showDetailModal(cardId) {
      openCardModal(cardId, true);
  }

  
  function exportData() {
    const data = { banks, cards };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `credit_card_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.banks && Array.isArray(data.banks) && data.cards && Array.isArray(data.cards)) {
          if (confirm('导入将覆盖当前所有数据，确定继续吗？')) {
            banks = data.banks;
            cards = data.cards;
            saveData();
            renderAll();
            alert('导入成功！');
          }
        } else {
          alert('文件格式不正确，请选择有效的备份文件。');
        }
      } catch (err) {
        alert('解析失败，请检查文件是否为合法 JSON。');
      }
    };
    reader.readAsText(file);
  }

  function initEvents() {
    document.getElementById('tabList').onclick = () => {
      document.getElementById('listView').classList.remove('hide');
      document.getElementById('calendarView').classList.add('hide');
      document.getElementById('tabList').classList.add('active');
      document.getElementById('tabCalendar').classList.remove('active');
      document.getElementById('filterBar').classList.remove('hide');
      
      // 显示添加卡片按钮（列表视图可见）

    // --- ⭐ 修复版：前一天和后一天 ---
    
    // 提取公共逻辑：根据偏移量修改日期
    function shiftSimulateDate(daysOffset) {
      // 1. 获取当前输入框的字符串值 (例如 "2026-06-04")
      let currentVal = simulateDateInput.value;
      let d;
      
      if (currentVal) {
        // ⭐ 关键修复：在日期字符串后加上 'T00:00:00'
        // 这会强制 JavaScript 把它当作“本地时间”来解析，彻底避免 UTC 时区偏差！
        d = new Date(currentVal + 'T00:00:00');
      } else {
        // 如果输入框为空，默认取今天的本地时间
        const now = new Date();
        d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      }
      
      // 2. 加减天数 (此时 d 是纯粹的本地时间，加减绝对准确)
      d.setDate(d.getDate() + daysOffset);
      
      // 3. 重新拼接成 'YYYY-MM-DD' 格式的字符串
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const newDateStr = `${year}-${month}-${day}`;
      
      // 4. 直接赋值给 .value (抛弃有坑的 .valueAsDate)
      simulateDateInput.value = newDateStr;

      // ⭐ 关键修改：让日历月份跟随新的推算日期
      calYear = d.getFullYear();
      calMonth = d.getMonth();
      
      // 5. 刷新页面
      renderCardTable();
      renderCalendar();
      updateAlerts();   // 加上这一行
    }

    

    // 绑定点击事件
    // 前一天按钮（单击 + 长按连续）
    const prevBtn = document.getElementById('prevDay');
    let longPressTimer = null;
    let isLongPressing = false;

    function startLongPress(step) {
        longPressTimer = setInterval(() => {
            shiftSimulateDate(step);
        }, 150); // 每150毫秒触发一次，可调整速度
    }
    function stopLongPress() {
        if (longPressTimer) {
            clearInterval(longPressTimer);
            longPressTimer = null;
        }
        isLongPressing = false;
    }

    // 单击事件（防止长按时也触发单击，用标志位区分）
    prevBtn.onmousedown = (e) => {
        e.preventDefault(); // 避免焦点丢失
        isLongPressing = false;
        // 延迟启动长按，避免短按也连续
        longPressTimer = setTimeout(() => {
            isLongPressing = true;
            startLongPress(-1);
        }, 300); // 300ms后开始连续减
    };
    prevBtn.onmouseup = () => {
        if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
        if (!isLongPressing) {
            // 没有触发长按时，执行单击
            shiftSimulateDate(-1);
        }
        stopLongPress();
    };
    prevBtn.onmouseleave = () => {
        // 鼠标离开按钮时停止连续
        if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
        stopLongPress();
    };
    // 触摸屏支持（可选）
    prevBtn.ontouchstart = (e) => {
        e.preventDefault();
        isLongPressing = false;
        longPressTimer = setTimeout(() => {
            isLongPressing = true;
            startLongPress(-1);
        }, 300);
    };
    prevBtn.ontouchend = () => {
        if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
        if (!isLongPressing) {
            shiftSimulateDate(-1);
        }
        stopLongPress();
    };
    prevBtn.ontouchcancel = prevBtn.ontouchend;

    // 后一天按钮（同样逻辑）

    function openCardModal(id = null, readOnly = false) {
        editingCardId = id;
        const modal = document.getElementById('cardModal');
        if (!modal) return;

        // 记录本次打开是否来自详情（只读模式）
        window._isFromDetail = readOnly;

        // 获取所有表单控件
        const allInputs = modal.querySelectorAll('input, select, textarea');
        
        // 重置表单（清空）
        document.getElementById('cardModalTitle').innerText = readOnly ? '卡片详情' : (id ? '编辑信用卡' : '添加信用卡');

        document.getElementById('cardLevel').value = '';
        document.getElementById('cardLastFour').value = '';
        document.getElementById('cardNickname').value = '';
        document.getElementById('cardNote').value = '';
        document.getElementById('cardLimit').value = '';
        document.getElementById('repaymentType').value = 'fixed';
        document.getElementById('repaymentValue').value = '';
        document.querySelectorAll('#orgCheckboxes input').forEach(cb => cb.checked = false);
        document.getElementById('cardExpiry').value = '';
        document.getElementById('cardVcc').value = '';
        document.getElementById('cardRepaymentDesc').value = '';
        document.getElementById('cardExpiry').value = '';
        document.getElementById('cardVcc').value = '';

        const billDayInput = document.getElementById('billDay');
        const billDayEndOfMonthCheck = document.getElementById('billDayEndOfMonth');
        billDayEndOfMonthCheck.checked = false;
        billDayInput.disabled = false;
        billDayInput.value = '';
        billDayInput.placeholder = '10';

                document.getElementById('cardBank').value = targetCard.bankId;
                document.getElementById('cardLevel').value = targetCard.level || '';
                document.getElementById('cardLastFour').value = targetCard.lastFour;
                document.getElementById('cardNickname').value = targetCard.nickname || '';
                document.getElementById('cardNote').value = targetCard.note || '';
                document.getElementById('cardLimit').value = targetCard.cardLimit;
                document.getElementById('cardExpiry').value = targetCard.expiry || '';
                document.getElementById('cardVcc').value = targetCard.vcc || '';
                document.getElementById('cardRepaymentDesc').value = targetCard.repaymentDesc || '';
                document.getElementById('cardExpiry').value = targetCard.expiry || '';
                document.getElementById('cardVcc').value = targetCard.vcc || '';

                if (targetCard.billDay === 0) {
                    billDayEndOfMonthCheck.checked = true;
                    billDayInput.disabled = true;
                    billDayInput.value = '';
                    billDayInput.placeholder = '月底';
                } else {
                    document.getElementById('billDay').value = targetCard.billDay;
                }
                document.getElementById('repaymentType').value = targetCard.repaymentType;
                document.getElementById('repaymentValue').value = targetCard.repaymentValue;
                document.getElementById('repaymentLabel').innerText = targetCard.repaymentType === 'fixed' ? '固定还款日' : '账单后天数';

                });

        const newBankBtn = document.getElementById('newBankInCard');

            editBtn.style.display = 'none';
            closeBtn.style.display = 'none';
            newBankBtn.disabled = false;
        }

    }


    function saveCard() {
      const bankId = document.getElementById('cardBank').value;
      if (!bankId) return alert('请选择银行');
      const bank = banks.find(b => b.id === bankId);
      if (!bank) return alert('银行不存在');

      const orgs = Array.from(document.querySelectorAll('#orgCheckboxes input:checked')).map(cb => cb.value);
      const level = document.getElementById('cardLevel').value;
      const lastFour = document.getElementById('cardLastFour').value;
      if (!lastFour) return alert('请输入卡号后四位');
      const nickname = document.getElementById('cardNickname').value;
      const note = document.getElementById('cardNote').value;
      const expiry = document.getElementById('cardExpiry').value;
      const vcc = document.getElementById('cardVcc').value;
      const repaymentDesc = document.getElementById('cardRepaymentDesc').value;
      const cardLimit = parseFloat(document.getElementById('cardLimit').value) || 0;
      const repaymentType = document.getElementById('repaymentType').value;
      const repaymentValue = parseInt(document.getElementById('repaymentValue').value) || 1;

      const isEndOfMonth = document.getElementById('billDayEndOfMonth').checked;
      const billDay = isEndOfMonth ? 0 : (parseInt(document.getElementById('billDay').value) || 1);

      // 额度校验：单张卡片额度不能超过银行总额度（共享关系）
      if (cardLimit > bank.totalLimit) {
          alert(`该银行总额度为 ${bank.totalLimit.toLocaleString()}元，卡片额度不能超过银行总额度。请调整卡片额度或增加银行总额度。`);
          return;
      }

      const cardData = {
          bankId, organizations: orgs, level, lastFour, nickname, note,
          cardLimit, billDay, repaymentType, repaymentValue,
          repaymentDesc, expiry, vcc   // 新增三个字段
      };

      if (editingCardId) {
          const idx = cards.findIndex(c => c.id === editingCardId);
          if (idx > -1) cards[idx] = { ...cards[idx], ...cardData };
      } else {
          cards.push({ id: Date.now().toString(), ...cardData });
      }
      saveData();
      document.getElementById('cardModal').classList.add('hide');
      renderAll();
  }
